<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rise & Crust Bakery</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fraunces:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}body{background:#fbf3e6;color:#3b2412}header{text-align:center;padding:80px 20px 20px}h1{font-family:Fraunces;font-size:clamp(56px,10vw,130px);font-weight:400;line-height:.9}h1 i{color:#d9822b}
.car{position:relative;height:420px;perspective:1200px;margin:30px 0}.ring{position:absolute;left:50%;top:40px;width:220px;height:300px;margin-left:-110px;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.it{position:absolute;inset:0;border-radius:24px;background:#fff;box-shadow:0 20px 40px -15px #3b241255;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;backface-visibility:hidden}
.it span{font-size:90px}.it b{font-family:Fraunces;font-size:22px}.it button{border:0;background:#3b2412;color:#fbf3e6;padding:10px 18px;border-radius:99px;cursor:pointer;font-weight:600}
.ctl{display:flex;justify-content:center;gap:14px}.ctl button{width:54px;height:54px;border-radius:50%;border:2px solid #3b2412;background:none;font-size:22px;cursor:pointer}
.cart{position:fixed;top:18px;right:18px;background:#3b2412;color:#fbf3e6;padding:12px 18px;border-radius:99px;font-weight:600}.cart b{background:#d9822b;border-radius:99px;padding:2px 9px;margin-left:6px;display:inline-block;transition:transform .3s}
.bump{transform:scale(1.5)}.fly{position:fixed;font-size:40px;pointer-events:none;transition:all .8s cubic-bezier(.5,-.4,.7,1);z-index:9}
.story{max-width:760px;margin:80px auto;padding:0 20px;font-family:Fraunces;font-size:26px;line-height:1.5;text-align:center}</style></head><body><div class="cart">🧺 Basket <b id="cn">0</b> · £<span id="ct">0.00</span></div><header><p style="letter-spacing:.3em;font-size:12px;text-transform:uppercase">Est. 2019 · baked at 4am</p><h1>Rise <i>&amp;</i> Crust</h1></header>
<div class="car"><div class="ring" id="ring"></div></div><div class="ctl"><button id="pv">←</button><button id="nx">→</button></div>
<p class="story">Slow sourdough, 48-hour croissants and the cinnamon buns people queue round the block for. <i>Order by 8pm, collect warm at 7am.</i></p><script>const P=[['🥐','Butter Croissant',2.8],['🍞','Country Sourdough',5.5],['🥯','Sesame Bagel',1.9],['🍩','Custard Doughnut',3.2],['🧁','Cinnamon Bun',3.5],['🥖','Baguette',2.6],['🍪','Sea Salt Cookie',2.4],['🥧','Apple Tart',4.2]];
const n=P.length,R=300;let a=0,cnt=0,tot=0;ring.innerHTML=P.map((p,i)=>`<div class="it" style="transform:rotateY(${i*360/n}deg) translateZ(${R}px)"><span>${p[0]}</span><b>${p[1]}</b><div>£${p[2].toFixed(2)}</div><button data-i=${i}>Add</button></div>`).join('');
const go=d=>{a+=d*360/n;ring.style.transform=`rotateY(${-a}deg)`};nx.onclick=()=>go(1);pv.onclick=()=>go(-1);setInterval(()=>go(1),3500);
ring.onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=P[b.dataset.i],r=b.getBoundingClientRect(),f=document.createElement('div');f.className='fly';f.textContent=p[0];f.style.left=r.left+'px';f.style.top=r.top+'px';document.body.appendChild(f);
const c=cn.getBoundingClientRect();requestAnimationFrame(()=>{f.style.left=c.left+'px';f.style.top=c.top+'px';f.style.transform='scale(.3)'});setTimeout(()=>{f.remove();cnt++;tot+=p[2];cn.textContent=cnt;ct.textContent=tot.toFixed(2);cn.classList.add('bump');setTimeout(()=>cn.classList.remove('bump'),300)},800)};</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fade House Barbers</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fraunces:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}:root{--g:#d4af37}body{background:#0b0b0b;color:#eee}
header{min-height:90vh;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#2a2410,#0b0b0b 60%);padding:40px 20px}
h1{font-family:'Space Grotesk';font-size:clamp(54px,11vw,150px);line-height:.85;letter-spacing:-.04em}h1 span{color:var(--g)}
.pole{width:26px;height:140px;margin:0 auto 30px;border-radius:14px;background:repeating-linear-gradient(45deg,#c1272d 0 14px,#fff 14px 28px,#1d4e9e 28px 42px,#fff 42px 56px);background-size:100% 79px;animation:p 1.2s linear infinite;box-shadow:0 0 40px #c1272d55}
@keyframes p{to{background-position:0 79px}}
.q{display:inline-flex;gap:10px;align-items:center;margin-top:24px;padding:10px 18px;border:1px solid #333;border-radius:99px}.q b{color:var(--g);font-size:22px}
section{max-width:1000px;margin:auto;padding:80px 20px}h2{font-family:'Space Grotesk';font-size:44px;margin-bottom:26px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.s{border:1px solid #2a2a2a;border-radius:18px;padding:22px;cursor:pointer;transition:.2s}
.s:hover,.s.on{border-color:var(--g);background:#1a1606}.s b{font-size:26px;color:var(--g);display:block;margin-top:10px}
.days{display:flex;gap:8px;overflow:auto;margin:24px 0}.d{min-width:70px;text-align:center;padding:12px;border:1px solid #2a2a2a;border-radius:14px;cursor:pointer}.d.on{background:var(--g);color:#000;font-weight:800}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}.sl{padding:12px;text-align:center;border-radius:12px;background:#151515;cursor:pointer}.sl.x{opacity:.25;text-decoration:line-through;pointer-events:none}.sl.on{background:var(--g);color:#000;font-weight:800}
.bk{margin-top:26px;width:100%;padding:18px;border:0;border-radius:14px;background:var(--g);font-weight:800;font-size:17px;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,150px);background:#fff;color:#000;padding:16px 24px;border-radius:14px;font-weight:600;transition:.4s}.toast.show{transform:translate(-50%,0)}</style></head><body><header><div><div class="pole"></div><h1>FADE<br><span>HOUSE</span></h1><p style="opacity:.6;margin-top:14px">Skin fades · beard sculpts · hot towel shaves</p><div class="q">🔴 Live queue: <b id="qn">3</b> waiting · ~<span id="qw">25</span> min</div></div></header>
<section><h2>1. Pick your cut</h2><div class="svc" id="svc"></div><h2 style="margin-top:50px">2. Pick a time</h2><div class="days" id="days"></div><div class="slots" id="slots"></div><button class="bk" id="bk">Book it</button></section><div class="toast" id="t"></div><script>const S=[['Skin Fade',18],['Scissor Cut',20],['Beard Sculpt',12],['Fade + Beard',26],['Hot Towel Shave',15],['Kids Cut',12]];let sel={s:0,d:0,t:null};
svc.innerHTML=S.map((s,i)=>`<div class="s ${i?'':'on'}" data-i=${i}>${s[0]}<b>£${s[1]}</b></div>`).join('');svc.onclick=e=>{const x=e.target.closest('.s');if(!x)return;[...svc.children].forEach(c=>c.classList.remove('on'));x.classList.add('on');sel.s=+x.dataset.i};
const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];for(let i=0;i<7;i++){const d=new Date(Date.now()+i*864e5);days.innerHTML+=`<div class="d ${i?'':'on'}" data-i=${i}>${i?D[d.getDay()]:'Today'}<br><b>${d.getDate()}</b></div>`}
function slots(){let h='';for(let t=9;t<19;t+=.5){const busy=((t*7+sel.d*13)%5)<2;h+=`<div class="sl ${busy?'x':''}">${Math.floor(t)}:${t%1?'30':'00'}</div>`}document.getElementById('slots').innerHTML=h}slots();
days.onclick=e=>{const x=e.target.closest('.d');if(!x)return;[...days.children].forEach(c=>c.classList.remove('on'));x.classList.add('on');sel.d=+x.dataset.i;slots()};
document.getElementById('slots').onclick=e=>{const x=e.target.closest('.sl');if(!x)return;document.querySelectorAll('.sl').forEach(c=>c.classList.remove('on'));x.classList.add('on');sel.t=x.textContent};
bk.onclick=()=>{t.textContent=sel.t?`✅ ${S[sel.s][0]} booked for ${sel.t} (demo)`:'Pick a time first 👆';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)};
setInterval(()=>{const n=2+Math.floor(Math.random()*4);qn.textContent=n;qw.textContent=n*8},4000);</script></body></html>

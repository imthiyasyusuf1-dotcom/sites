<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IronCore Fitness</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fraunces:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit}body{background:#f4f4f0;color:#111}header{background:#111;color:#f4f4f0;padding:120px 6vw 80px;position:relative;overflow:hidden}
h1{font-family:'Space Grotesk';font-size:clamp(60px,12vw,170px);line-height:.82;letter-spacing:-.05em}h1 i{color:#c6ff00;font-style:normal}
.big{position:absolute;right:-40px;bottom:-60px;font-size:320px;opacity:.06;font-weight:800}
.cd{display:flex;gap:14px;margin-top:40px}.cd div{background:#c6ff00;color:#111;padding:14px 18px;border-radius:12px;text-align:center;min-width:80px}.cd b{font-size:34px;display:block;font-family:'Space Grotesk'}
section{padding:80px 6vw}h2{font-family:'Space Grotesk';font-size:48px;margin-bottom:30px;letter-spacing:-.03em}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:40px;background:#fff;border-radius:28px;padding:36px}label{display:block;font-weight:600;margin:18px 0 8px}input[type=range]{width:100%;accent-color:#111}
.res{background:#111;color:#fff;border-radius:22px;padding:30px}.res b{font-family:'Space Grotesk';font-size:64px;color:#c6ff00;display:block}
.bar{height:14px;border-radius:9px;background:#333;margin:10px 0;overflow:hidden}.bar i{display:block;height:100%;background:#c6ff00;transition:width .4s}
.tt{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.cl{background:#fff;border-radius:16px;padding:18px;border-left:6px solid #c6ff00}.cl small{opacity:.5}
.goal{display:flex;gap:8px;margin-top:10px}.goal span{padding:8px 14px;border-radius:99px;border:2px solid #111;cursor:pointer;font-weight:600}.goal .on{background:#111;color:#c6ff00}
@media(max-width:800px){.calc{grid-template-columns:1fr}}</style></head><body><header><h1>IRON<br><i>CORE</i></h1><p style="margin-top:20px;opacity:.7;max-width:420px">24/7 strength gym. No contracts. First session free.</p><p style="margin-top:30px;font-weight:600">Next HIIT class starts in:</p><div class="cd"><div><b id="m">00</b>min</div><div><b id="s">00</b>sec</div></div><div class="big">🏋</div></header>
<section><h2>Your macros, instantly</h2><div class="calc"><div><label>Weight: <span id="wv"></span> kg</label><input type="range" id="w" min="45" max="140" value="78"><label>Height: <span id="hv"></span> cm</label><input type="range" id="h" min="150" max="205" value="178"><label>Age: <span id="av"></span></label><input type="range" id="a" min="16" max="70" value="22"><label>Goal</label><div class="goal" id="g"><span data-k="-400">Cut</span><span class="on" data-k="0">Maintain</span><span data-k="350">Bulk</span></div></div>
<div class="res">Daily calories<b id="kc">0</b><div>Protein <span id="pp"></span>g</div><div class="bar"><i id="pb"></i></div><div>Carbs <span id="cc"></span>g</div><div class="bar"><i id="cb"></i></div><div>Fat <span id="ff"></span>g</div><div class="bar"><i id="fb"></i></div></div></div></section>
<section style="padding-top:0"><h2>Today's classes</h2><div class="tt" id="tt"></div></section><script>let k=0;function c(){const W=+w.value,H=+h.value,A=+a.value;wv.textContent=W;hv.textContent=H;av.textContent=A;const bmr=10*W+6.25*H-5*A+5,t=Math.round(bmr*1.55+k);kc.textContent=t;
const p=Math.round(W*2),f=Math.round(t*.25/9),cb_=Math.round((t-p*4-f*9)/4);pp.textContent=p;ff.textContent=f;cc.textContent=cb_;pb.style.width=Math.min(100,p/3)+'%';fb.style.width=Math.min(100,f)+'%';cb.style.width=Math.min(100,cb_/4)+'%'}
[w,h,a].forEach(x=>x.oninput=c);g.onclick=e=>{const x=e.target.closest('span');if(!x)return;[...g.children].forEach(y=>y.classList.remove('on'));x.classList.add('on');k=+x.dataset.k;c()};c();
tt.innerHTML=[['06:30','HIIT Burn','Sam'],['08:00','Powerlifting','Dev'],['12:15','Spin 45','Aisha'],['17:30','Boxing','Marcus'],['18:45','Glutes & Core','Priya'],['20:00','Mobility','Tom']].map(x=>`<div class="cl"><small>${x[0]}</small><h3>${x[1]}</h3><small>with ${x[2]}</small></div>`).join('');
setInterval(()=>{const n=new Date(),r=(60-n.getMinutes()%60)*60-n.getSeconds();m.textContent=String(Math.floor(r/60)).padStart(2,'0');s.textContent=String(r%60).padStart(2,'0')},1000);</script></body></html>
